<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b101c">
<title>Space Glider | White House Games</title>
<link rel="stylesheet" href="/space-glider/game.css">
<link rel="stylesheet" href="/game-cards.css">
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
</head>
<body>
<canvas id="city" aria-label="Space Glider flight view"></canvas>
<header><a href="/games?game=glider">More Games</a><button id="sound" type="button" aria-pressed="true">Sound on</button></header>
<aside id="flight" aria-label="Flight stats">
 <div><small>Distance</small><strong id="distance">0 m</strong></div>
 <div><small>Speed</small><strong id="speed">0 km/h</strong></div>
 <div><small>Power-up</small><strong id="power">—</strong></div>
</aside>
<p id="modeStatus" role="status"></p>
<main id="panel">
 <div class="flight-panel-top"><h1 id="heading">Space Glider</h1><button id="play" disabled>Launch</button></div>
 <div class="flight-panel-body">
 <p id="message">Find your own route through the shapes. Collect shields and slow-time power-ups as you fly.</p>
 <p id="best"></p>
 <div class="loadout">
  <label for="pilot">Pilot name<input id="pilot" maxlength="20" value="Pilot"></label>
  <label for="flightMode">Play mode<select id="flightMode"><option value="solo">Solo</option><option value="ghost">Ghost</option><option value="live">Live Players</option></select></label>
  <label for="craft">Craft<select id="craft"><option value="arrow">Arrow</option><option value="mantis">Mantis</option><option value="wraith">Wraith</option><option value="split">Splitwing</option></select></label>
  <label for="paint">Paint color<input id="paint" type="color" value="#e1e9f4"></label>
  <label for="country">Flag<select id="country"></select></label>
 </div>
 <button id="showScores" type="button" aria-controls="scoresPanel" aria-expanded="false">Leaderboard</button>
 <p id="scoreStatus" role="status"></p>
 <nav class="game-shelf" data-other-games="glider" aria-label="Other games" hidden></nav>
 <small>Hold ← / → or the on-screen buttons to steer.</small>
 </div>
</main>
<aside id="scoresPanel" hidden aria-labelledby="scoresTitle">
 <div><h2 id="scoresTitle">Daily leaderboard</h2><button id="closeScores" aria-label="Close leaderboard">×</button></div>
 <ol id="scores"></ol>
</aside>
<div id="controls" hidden aria-label="Steering">
 <button id="left" aria-label="Steer left">←</button>
 <button id="right" aria-label="Steer right">→</button>
</div>
<script type="module" src="/game-cards.js"></script>
<script type="module" src="/space-glider/game.js"></script>
</body>
</html>
